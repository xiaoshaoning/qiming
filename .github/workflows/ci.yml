name: CI

on:
  push:
    branches: [main, master, phase*]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── C library build + test (fastest feedback) ──
  c-tests:
    name: C tests
    timeout-minutes: 40
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S libqsim -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build and run C tests
        run: |
          cmake --build build --target qsim_test
          ctest --test-dir build --output-on-failure -R qsim_test

  # ── C library build + test on Windows (uses pre-generated PEG parsers; the
  #     peg tool is not present on runners, which also exercises that path) ──
  c-tests-windows:
    name: C tests (Windows)
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        working-directory: libqsim
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        working-directory: libqsim
        run: cmake --build build --config Release --parallel

      - name: Run tests
        working-directory: libqsim
        run: ctest --test-dir build -C Release --output-on-failure

  # ── Memory safety: ASan + UBSan on the C library ──
  # Would have caught the P0-1 double-free (heap corruption) before it shipped.
  sanitizers:
    name: Sanitizers (ASan+UBSan)
    timeout-minutes: 40
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake with sanitizers
        run: cmake -B build -S libqsim -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
               -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

      - name: Build and run C tests under sanitizers
        run: |
          cmake --build build --target qsim_test
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
          ctest --test-dir build --output-on-failure -R qsim_test

  # ── Rust build + unit tests ──
  rust-tests:
    name: Rust tests
    timeout-minutes: 40
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install C dependencies
        run: timeout 600 sudo apt-get update -qq && timeout 600 sudo apt-get install -y -qq cmake gcc golang-go libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build (with tests)
        run: cargo build --manifest-path src-tauri/Cargo.toml --tests

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ── Python integration tests against MCP TCP server ──
  python-integration:
    name: Python integration tests
    timeout-minutes: 40
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps for tauri (webkit, dbus)
        run: timeout 600 sudo apt-get update -qq && timeout 600 sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libdbus-1-dev


      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build qsim binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin qsim

      - name: Install Python package
        run: pip install -e python

      - name: Start MCP TCP server and run integration tests
        run: |
          # Start the MCP TCP server in the background
          ./target/debug/qsim mcp --tcp 127.0.0.1:9876 &
          MCP_PID=$!

          # Wait for server to accept connections (up to 30s)
          for i in $(seq 1 30); do
            if python3 -c "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 9876)); s.close()" 2>/dev/null; then
              echo "MCP server ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Run basic and integration tests
          cd python
          python tests/test_basic.py
          python tests/test_integration.py

          # Stop the server
          kill $MCP_PID 2>/dev/null || true
          wait $MCP_PID 2>/dev/null || true

  # ── TLA+ model check of the reference scheduler (needs Java + TLC) ──
  # continue-on-error: the tla2tools.jar download from GitHub can be flaky and
  # the first CI run should confirm the model-check actually passes. Make it a
  # required check once it has gone green a few times.
  tla:
    name: TLA+ model check
    timeout-minutes: 40
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run TLC model check
        run: bash tla/check.sh | tee tla/tlc.log; exit ${PIPESTATUS[0]}

      - name: Upload TLC log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-log
          path: tla/tlc.log

  # ── Release packaging (tags only) ──
  package:
    name: Package (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        working-directory: libqsim
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        working-directory: libqsim
        run: cmake --build build --config Release --parallel

      - name: Run tests
        working-directory: libqsim
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare package
        shell: bash
        run: |
          mkdir -p release/qiming-${{ runner.os }}
          # Headers
          cp -r libqsim/include/libqsim release/qiming-${{ runner.os }}/include/
          # Library
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp libqsim/build/Release/qsim.lib release/qiming-${{ runner.os }}/lib/
          else
            cp libqsim/build/libqsim.a release/qiming-${{ runner.os }}/lib/
          fi
          # Test binary
          mkdir -p release/qiming-${{ runner.os }}/bin
          cp libqsim/build/qsim_test* release/qiming-${{ runner.os }}/bin/ 2>/dev/null || true
          cp libqsim/build/Release/qsim_test* release/qiming-${{ runner.os }}/bin/ 2>/dev/null || true
          # README
          cat > release/qiming-${{ runner.os }}/README.txt << 'EOF'
          Qiming Simulator ${{ runner.os }} Release
          =====================================
          include/ — C API headers
          lib/     — Static library (link against this)
          bin/     — Test suite executable
          EOF

      - name: Create archive
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cd release && 7z a qiming-${{ runner.os }}.zip qiming-${{ runner.os }}/
          else
            cd release && tar czf qiming-${{ runner.os }}.tar.gz qiming-${{ runner.os }}/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qiming-${{ runner.os }}
          path: release/qiming-${{ runner.os }}.*
  # ── Performance benchmark (main branch only) ──
  performance:
    name: Performance
    timeout-minutes: 40
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps for tauri (webkit, dbus)
        run: timeout 600 sudo apt-get update -qq && timeout 600 sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libdbus-1-dev


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build qsim binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin qsim --release

      - name: Run benchmark
        run: |
          RESULT="bench_result.json"
          BASELINE="docs/bench_baseline_linux.json"
          ./target/release/qsim bench --save "$RESULT"

          if [ ! -f "$BASELINE" ]; then
            echo "No Linux baseline found -- saving current result as baseline."
            cp "$RESULT" "$BASELINE"
            echo "Commit the new baseline: docs/bench_baseline_linux.json"
          else
            python3 -c "import json,sys;c=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2]));r=float(c['steps_per_sec'])/float(b['steps_per_sec']);print(f'Baseline: {float(b[\"steps_per_sec\"]):.0f} steps/sec');print(f'Current:  {float(c[\"steps_per_sec\"]):.0f} steps/sec');print(f'Ratio:    {r:.3f}');sys.exit(0 if r>=0.9 else 1)" "$RESULT" "$BASELINE"
          fi
